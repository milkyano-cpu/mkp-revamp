<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f5" />
    <title>Bike | MKP Bikes</title>
    <meta name="description" content="Inspected, serviced and ready to ride. Test ride in Cheltenham or delivered Australia-wide." />
    <link rel="icon" href="assets/site/mkp-logo.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@500;600&family=Poppins:wght@700&display=swap" />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/data.js" defer></script>
    <script src="js/app.js" defer></script>
    <script src="js/bike.js" defer></script>
  </head>
  <body data-page="shop">
    <main data-pdp>
      <div class="wrap"><nav class="crumbs" aria-label="Breadcrumb" data-crumbs></nav></div>
      <div class="wrap pdp">
        <div class="gallery" data-gallery></div>
        <aside class="buybox" data-buybox></aside>
      </div>

      <section class="section" style="background:var(--surface)" aria-labelledby="about-bike">
        <div class="wrap details">
          <div>
            <span class="eyebrow">About this bike</span>
            <h2 class="h2" id="about-bike" style="margin:10px 0 28px" data-about-title></h2>
            <div class="prose" data-desc></div>
          </div>
          <div>
            <span class="eyebrow">Specifications</span>
            <h2 class="h2" style="margin:10px 0 28px">The details</h2>
            <dl class="specs" data-specs></dl>
            <div class="chips" style="margin-top:24px" data-features></div>
          </div>
        </div>
      </section>

      <section class="section" aria-labelledby="related-title">
        <div class="wrap">
          <div class="section-head"><h2 class="h2" id="related-title">You might also like</h2><a class="link-arrow" href="shop.html">All bikes</a></div>
          <div class="grid" data-related></div>
        </div>
      </section>
    </main>
  </body>
</html>
