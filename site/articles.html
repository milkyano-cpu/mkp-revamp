<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Articles and News | MKP Bikes</title>
<meta name="description" content="Discover the latest articles, tips, and insights about bikes, cycling, and more from MKP Bikes in Cheltenham, Melbourne.">
<link rel="icon" href="img/mkp-logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body data-page="articles">
<div id="site-nav"></div>

<main>
  <section class="phero" style="padding-bottom:0">
    <div class="wrap">
      <nav class="crumbs mono" aria-label="Breadcrumb"><a href="index.html">Home</a><span aria-hidden="true">/</span><span>Articles</span></nav>
      <h1>Articles and news.</h1>
      <p class="sub">Discover the latest articles, tips, and insights about bikes, cycling, and more.</p>
      <div class="chips art-tags" id="artTags" role="group" aria-label="Filter by topic"></div>
    </div>
  </section>

  <section class="sec" style="padding-top:40px">
    <div class="wrap">
      <a class="art-lead reveal" id="artLead" href="#"></a>
      <div class="art-grid" id="artGrid"></div>
    </div>
  </section>
</main>

<div id="site-foot"></div>
<script src="js/bikes-data.js"></script>
<script src="js/api.js"></script>
<script src="js/articles-data.js"></script>
<script src="js/articles-live.js"></script>
<script src="js/site.js"></script>
<script>
  (() => {
    const S = window.MKPsite;
    const A = window.MKP_ARTICLES || [];
    const date = d => new Date(d + 'T00:00:00').toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' });
    const url = a => `article.html?slug=${encodeURIComponent(a.slug)}`;
    // topic chips grouped from his tags so the row stays short
    const TOPICS = [
      ['all', 'All'],
      ['fit', 'Bike Fitting', a => /fit/i.test(a.title + a.tags.join(' '))],
      ['care', 'Maintenance', a => /tyre|clean|mistake/i.test(a.title)],
      ['gear', 'Gear and Tavelo', a => /wheel|tavelo|carbon/i.test(a.title + a.tags.join(' '))],
      ['shop', 'About MKP', a => /mkp|shop|second-hand/i.test(a.title + a.tags.join(' '))],
    ];
    const lead = document.getElementById('artLead'), grid = document.getElementById('artGrid'), tags = document.getElementById('artTags');
    const meta = a => `<span class="mono art-meta">${date(a.date)} · ${a.readTime} min read</span>`;
    const card = a => `
<a class="art-card reveal" href="${url(a)}">
  <span class="art-img"><img src="${S.esc(a.image)}" alt="" loading="lazy"></span>
  ${meta(a)}
  <h3>${S.esc(a.title)}</h3>
  <p>${S.esc(a.excerpt)}</p>
</a>`;
    function render(topic) {
      const t = TOPICS.find(x => x[0] === topic) || TOPICS[0];
      const list = t[2] ? A.filter(t[2]) : A;
      const [first, ...rest] = list;
      lead.hidden = !first;
      if (first) {
        lead.href = url(first);
        lead.innerHTML = `<span class="art-img"><img src="${S.esc(first.image)}" alt=""></span>
<span class="art-lead-copy"><span class="tag orange">Latest</span>${meta(first)}<span class="art-lead-title">${S.esc(first.title)}</span><span class="art-lead-ex">${S.esc(first.excerpt)}</span><span class="link">Read article</span></span>`;
        lead.classList.remove('in');
      }
      grid.innerHTML = rest.map(card).join('');
      S.reveal(document);
      tags.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.dataset.t === t[0]));
      const q = new URLSearchParams(location.search);
      t[0] === 'all' ? q.delete('topic') : q.set('topic', t[0]);
      history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : ''));
    }
    tags.innerHTML = TOPICS.filter(t => !t[2] || A.some(t[2])).map(t => `<button type="button" class="chip" data-t="${t[0]}">${t[1]}</button>`).join('');
    tags.addEventListener('click', e => { const c = e.target.closest('.chip'); if (c) render(c.dataset.t); });
    render(new URLSearchParams(location.search).get('topic') || 'all');
    // fresh list from the backend (articles published or unpublished in the admin)
    document.addEventListener('mkp:articles', () => render(new URLSearchParams(location.search).get('topic') || 'all'));
  })();
</script>
</body>
</html>
