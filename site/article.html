<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Article | MKP Bikes</title>
<meta name="description" content="Articles, tips and insights about bikes and cycling from MKP Bikes in Cheltenham, Melbourne.">
<link rel="icon" href="img/mkp-logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body data-page="articles">
<div id="site-nav"></div>

<main id="art"></main>

<div id="site-foot"></div>
<script src="js/bikes-data.js"></script>
<script src="js/api.js"></script>
<script src="js/articles-data.js"></script>
<script src="js/articles-live.js"></script>
<script src="js/site.js"></script>
<script>
  (() => {
    const S = window.MKPsite;
    const A = window.MKP_ARTICLES || [];
    const slug = new URLSearchParams(location.search).get('slug');
    const main = document.getElementById('art');
    const notFound = () => { main.innerHTML = `<section class="notfound wrap"><span class="mono eyebrow">404</span><h1 style="font-size:clamp(36px,5vw,64px)">Article Not Found.</h1><p class="sub" style="margin:18px auto 28px">It may have moved. Have a look at the latest articles instead.</p><a class="btn dark" href="articles.html">All articles</a></section>`; };
    const known = A.find(x => x.slug === slug);
    if (known && known.html) show(known);
    else if (window.MKP_ARTICLES_API) {
      // published in the admin after the snapshot was taken: load it from the backend
      main.innerHTML = '<section class="notfound wrap"><p class="sub">Loading article…</p></section>';
      MKP_ARTICLES_API.full(slug).then(a => a ? show(a) : notFound());
    } else notFound();

    function show(a) {
    document.title = `${a.title} | MKP Bikes`;
    document.querySelector('meta[name=description]').content = a.excerpt;
    const date = new Date(a.date + 'T00:00:00').toLocaleDateString('en-AU', { day: 'numeric', month: 'long', year: 'numeric' });
    const more = A.filter(x => x.slug !== a.slug).slice(0, 3);
    const isFit = /fit/i.test(a.title + a.tags.join(' '));
    const isTav = /tavelo|wheel|carbon/i.test(a.title + a.tags.join(' '));
    const cta = isFit
      ? ['Bike Fitting', 'Book your fitting today', '90 minutes with Ash Saxena in Cheltenham. Full refund if you feel no improvement.', 'book-fitting.html', 'Choose a time']
      : isTav
      ? ['Now available', 'Tavelo bikes, frames and components', 'Lifetime warranty and local support in Cheltenham.', 'tavelo.html', 'Explore Tavelo']
      : ['Shop', 'Find your next bike', 'Hand-selected pre-owned and new road bikes, inspected and ready to ride.', 'bikes.html', 'Shop bikes'];
    main.innerHTML = `
<article>
  <header class="phero art-head">
    <div class="wrap narrow">
      <nav class="crumbs mono" aria-label="Breadcrumb"><a href="index.html">Home</a><span aria-hidden="true">/</span><a href="articles.html">Articles</a><span aria-hidden="true">/</span><span>${a.readTime} min read</span></nav>
      <h1>${S.esc(a.title)}</h1>
      <p class="sub">${S.esc(a.excerpt)}</p>
      <p class="mono art-by"><span>MKP Bikes</span><span>${date}</span><span>${a.readTime} min read</span></p>
    </div>
    <div class="wrap"><div class="art-hero reveal"><img src="${S.esc(a.image)}" alt="${S.esc(a.title)}"></div></div>
  </header>
  <div class="wrap narrow">
    <div class="prose art-body">${a.html}</div>
    ${a.tags.length ? `<div class="features">${a.tags.map(t => `<span>${S.esc(t)}</span>`).join('')}</div>` : ''}
    <div class="art-share">
      <a class="btn dark" href="#" data-wa="Hi MKP Bikes, I just read your article: ${S.LIVE}/article/${a.slug}">Ask us about this</a>
      <a class="btn ghost" href="articles.html">All articles</a>
    </div>
  </div>
</article>
<section class="sec">
  <div class="wrap">
    <a class="tav-card reveal" href="${cta[3]}">
      <span class="tav-logo"><img src="img/${isTav ? 'tavelo-logo.png' : 'mkp-logo.jpg'}" alt=""></span>
      <span class="tav-copy"><span class="mono eyebrow light">${cta[0]}</span><span class="tav-title">${cta[1]}</span><span class="tav-sub">${cta[2]}</span></span>
      <span class="btn outline tav-btn">${cta[4]} <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></span>
    </a>
  </div>
</section>
<section class="sec tight">
  <div class="wrap">
    <div class="sec-head reveal"><div><span class="mono eyebrow">Keep reading</span><h2>More articles.</h2></div><a class="link" href="articles.html">All articles</a></div>
    <div class="art-grid">${more.map(m => `
      <a class="art-card reveal" href="article.html?slug=${encodeURIComponent(m.slug)}">
        <span class="art-img"><img src="${S.esc(m.image)}" alt="" loading="lazy"></span>
        <span class="mono art-meta">${m.readTime} min read</span>
        <h3>${S.esc(m.title)}</h3>
        <p>${S.esc(m.excerpt)}</p>
      </a>`).join('')}
    </div>
  </div>
</section>`;
    // outside links open in a new tab
    main.querySelectorAll('.art-body a[href^="http"]').forEach(l => { l.target = '_blank'; l.rel = 'noopener'; });
    S.wireWa(main);
    S.reveal(main);
    }
  })();
</script>
</body>
</html>
