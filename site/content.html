<script>
  // Videos from mkpbikes.com.au/api/videos (Oct 2026), same order as the live gallery.
  (() => {
    const S = window.MKPsite;
    const S3 = 'https://s3.milkyano.com/milkyano/mkp-bikes/';
    const VIDEOS = [
      { title: 'Thanks For Following', desc: 'MKP Bikes, your premium bike shop', video: 'thanks-for-following-resized-1771944675542.mp4', thumb: 'Thumbnail_-_Thanks_for_Following-1771944861955.jpg' },
      { title: 'Sell Your Bikes', desc: 'MKP Bikes, your premium bike shop', video: 'sell-your-bikes-resized-1771945881561.mp4', thumb: 'Thumbnail_-_Sell_Your_Bike-1771946213916.jpg', link: ['/sell.html', 'Sell your bike'] },
      { title: 'Test Ride', desc: 'MKP Bikes, your premium bike shop', video: 'mkp-test-ride-resized.mp4', thumb: 'Thumbnail_-_Test_Ride-1771946599310.jpg', link: ['/bikes.html', 'Pick a bike to test ride'] },
    ];
    VIDEOS.forEach(v => { v.video = S3 + v.video; v.thumb = S3 + v.thumb; });
    const host = document.getElementById('reels');
    // play muted while on screen, pause when scrolled away
    const io = new IntersectionObserver(es => es.forEach(e => {
      const v = e.target;
      if (e.isIntersecting) { v.preload = 'auto'; v.play().catch(() => {}); } else v.pause();
    }), { threshold: 0.4 });
    const LINKS = { 'sell your bike': ['/sell.html', 'Sell your bike'], 'sell your bikes': ['/sell.html', 'Sell your bike'], 'test ride': ['/bikes.html', 'Pick a bike to test ride'] };
    function draw(list) {
    host.innerHTML = list.map(v => `
<figure class="reel reveal">
  <div class="reel-media">
    <video src="${S.esc(v.video)}" poster="${S.esc(v.thumb)}" muted loop playsinline preload="none"></video>
    <button class="reel-sound" type="button" aria-pressed="false" aria-label="Turn sound on"><span class="mono">Sound</span></button>
    <span class="tag orange on-dark reel-tag">Our content</span>
  </div>
  <figcaption>
    <h3>${S.esc(v.title)}</h3>
    <p class="mono">@MKP Bikes</p>
    <p class="reel-desc">${S.esc(v.desc)}</p>
    ${v.link ? `<a class="link" href="${v.link[0]}">${v.link[1]}</a>` : ''}
  </figcaption>
</figure>`).join('');
    S.reveal(host);
    host.querySelectorAll('video').forEach(v => io.observe(v));
    }

    draw(VIDEOS);
    // videos managed in the admin (/api/videos) replace the snapshot when the backend is reachable
    fetch('/api/videos').then(r => r.ok ? r.json() : Promise.reject()).then(list => {
      if (!Array.isArray(list) || !list.length) return;
      draw(list.map(x => ({ title: x.title, desc: String(x.description || '').replace(/\s+[-–—]\s+/g, ', '), video: x.videoUrl, thumb: x.thumbnailUrl, link: LINKS[String(x.title).toLowerCase()] })));
    }).catch(() => {});

    // one video with sound at a time
    host.addEventListener('click', e => {
      const b = e.target.closest('.reel-sound');
      if (!b) return;
      const v = b.parentElement.querySelector('video');
      const on = v.muted;
      host.querySelectorAll('video').forEach(x => { x.muted = true; });
      host.querySelectorAll('.reel-sound').forEach(x => { x.setAttribute('aria-pressed', 'false'); x.setAttribute('aria-label', 'Turn sound on'); });
      if (on) { v.muted = false; v.play().catch(() => {}); b.setAttribute('aria-pressed', 'true'); b.setAttribute('aria-label', 'Turn sound off'); }
    });
  })();
</script>
