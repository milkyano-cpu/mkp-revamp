server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same idea as tools/dev-server.py: read-only API calls go to the live backend
    # (server-side, so no CORS problem). Live bikes, articles and videos then load on staging.
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    set $live https://www.mkpbikes.com.au;

    # Read-only POST endpoints that the dev server also allows (chat, recommendations, favourites)
    location ~ ^/api/(chat|chat/size|recommendations|bikes/favourites)$ {
        proxy_pass $live;
        proxy_set_header Host www.mkpbikes.com.au;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header User-Agent "mkp-redesign-staging";
    }

    location /api/ {
        # Block form posts on staging so testing never creates real leads or emails
        limit_except GET HEAD {
            deny all;
        }
        proxy_pass $live;
        proxy_set_header Host www.mkpbikes.com.au;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header User-Agent "mkp-redesign-staging";
    }

    # Clean URLs: /about -> about.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location ~* \.(webp|jpg|jpeg|png|svg|gif|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
    location ~* \.(css|js|html)$ {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}
